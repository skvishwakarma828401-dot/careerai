version: '3.8'

services:
  # ==============================================================================
  # 1. MongoDB Database Container
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: careerai-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - careerai-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================================
  # 2. Redis In-Memory Cache & BullMQ Queue Container
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: careerai-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - careerai-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==============================================================================
  # 3. CareerAI Backend Server Container (Express, Socket.IO, BullMQ Workers)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/careerai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-careerai_super_secret_jwt_key_2026_production_grade}
      - JWT_EXPIRE=30d
      - JWT_COOKIE_EXPIRE=30
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careerai-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==============================================================================
  # 4. CareerAI Frontend Container (Vite React + Nginx Reverse Proxy)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerai-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careerai-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  careerai-network:
    driver: bridge
